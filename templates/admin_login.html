{% extends "layout.html" %}

{% block title %}Admin Login | FeedbackHub{% endblock %}

{% block content %}
<main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
        <a class="login-brand" href="{{ url_for('feedback_form') }}">FeedbackHub</a>
        <p class="login-eyebrow">ADMINISTRATION</p>
        <h1 id="login-title">Welcome back</h1>
        <p class="login-description">Sign in to view your feedback dashboard.</p>

        {% if error %}
        <p class="form-message error-message" role="alert">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="submit-btn" type="submit">Sign in</button>
        </form>
        <a class="login-back-link" href="{{ url_for('feedback_form') }}">Back to feedback form</a>
    </section>
</main>
{% endblock %}
